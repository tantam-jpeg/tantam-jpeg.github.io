<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>tantam.jpeg — Thania Sukendy</title>

  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #6b5744;
      --cream: #faf1e6;
      --card: #fdf6ec;
      --blush: #f3c9d6;
      --mint: #dcefe1;
      --butter: #f6de9b;
      --sky: #c9e3ff;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--cream);
      background-image: radial-gradient(var(--blush) 1.5px, transparent 1.8px);
      background-size: 22px 22px;
      color: var(--ink);
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
    }

    body {
      position: relative;
      padding: 40px 16px 80px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------------- SOFT BOW ACCENTS (replaces washi tape) ---------------- */
    .bow-accent { position: absolute; z-index: 4; opacity: 0.95; }

    /* ---------------- NAV ---------------- */
    .nav-twee {
      position: relative;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }
    .nav-twee a {
      font-family: 'Gaegu', cursive;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--ink);
      text-decoration: none;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 6px 16px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .nav-twee a:nth-child(1) { background: var(--blush); }
    .nav-twee a:nth-child(2) { background: var(--mint); }
    .nav-twee a:nth-child(3) { background: var(--butter); }
    .nav-twee a:nth-child(4) { background: var(--sky); }
    .nav-twee a:nth-child(5) { background: var(--blush); }
    .nav-twee a:nth-child(6) { background: var(--mint); }
    .nav-twee a:hover { transform: translateY(-2px); }

    /* ---------------- SCALLOPED CARD ---------------- */
    .scallop-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border: 2.5px solid var(--ink);
      border-radius: 30px;
      padding: 50px 30px 40px 30px;
      box-shadow: 0 8px 0 rgba(107, 87, 68, 0.12);
    }
    .scallop-edge {
      position: absolute;
      top: -14px;
      left: 20px;
      right: 20px;
      height: 26px;
      display: flex;
      justify-content: space-between;
    }
    .scallop-edge span {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--card);
      border: 2.5px solid var(--ink);
    }

    .h-welcome {
      display: block;
      text-align: center;
      font-family: 'Gaegu', cursive;
      font-weight: 400;
      font-size: 1.15rem;
      color: #b3546b;
      margin-bottom: 2px;
    }

    .logo {
      display: block;
      text-align: center;
      font-family: 'Gaegu', cursive;
      font-weight: 700;
      font-size: clamp(2.4rem, 9vw, 3.4rem);
      color: var(--ink);
      margin-bottom: 12px;
    }

    .tagline {
      display: block;
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      color: #7a6a58;
      max-width: 380px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ---------------- SCATTERED PRECIOUS MOTIFS ---------------- */
    .motif { position: absolute; z-index: 1; }

    @media (max-width: 480px) {
      .motif, .bow-accent { transform: scale(0.7); }
      .scallop-card { padding: 44px 18px 30px 18px; }
      .nav-twee a { font-size: 0.95rem; padding: 5px 13px; }
    }
  </style>
</head>
