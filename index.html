<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>tantam.jpeg — Thania Sukendy</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,600&family=Homemade+Apple&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #fbf7ee;
      color: #3a352e;
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }

    /* soft paper grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1.4px);
      background-size: 9px 9px;
      pointer-events: none;
      z-index: 0;
    }

    body {
      position: relative;
      padding: 70px 16px 90px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------------- SOFT WATERCOLOR BLOBS behind the doodles ---------------- */
    .wash {
      position: absolute;
      border-radius: 50%;
      filter: blur(14px);
      opacity: 0.55;
      z-index: 0;
    }

    /* ---------------- ORIGINAL LINE-ART DOODLES ---------------- */
    .doodle {
      position: absolute;
      z-index: 1;
      opacity: 0.92;
    }

    /* ---------------- MAIN STAGE ---------------- */
    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .h-welcome {
      display: block;
      font-family: 'Homemade Apple', cursive;
      font-size: 1.3rem;
      color: #b98a9a;
      margin-bottom: 4px;
      transform: rotate(-2deg);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(2.6rem, 9vw, 4rem);
      color: #2f2a22;
      margin-bottom: 10px;
      line-height: 1.05;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      font-style: italic;
      color: #5a5346;
      line-height: 1.55;
      max-width: 420px;
      margin: 0 auto 40px auto;
    }

    /* ---------------- NAV ---------------- */
    .nav-vintage {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
      margin-bottom: 8px;
    }
    .nav-vintage a {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      font-size: 1rem;
      color: #3a352e;
      text-decoration: none;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(58, 53, 46, 0.35);
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .nav-vintage a:hover { color: #b3546b; border-color: #b3546b; }

    @media (max-width: 480px) {
      .doodle { transform: scale(0.65); }
      .nav-vintage { gap: 14px; }
      .nav-vintage a { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
