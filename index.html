<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>tantam.jpeg — Thania Sukendy</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(160deg, #ff2f92 0%, #ff5fa8 45%, #ff8fc0 100%);
      color: #2b1030;
      font-family: 'Quicksand', sans-serif;
      overflow-x: hidden;
    }

    body {
      position: relative;
      padding: 60px 16px 80px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------------- SCATTERED STICKER LAYER (original shapes, no copied art) ---------------- */
    .sticker-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .sticker {
      position: absolute;
      filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.25));
    }

    /* ---------------- MAIN CONTENT ---------------- */
    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    /* ---------------- CHUNKY GRADIENT BUBBLE LOGO ---------------- */
    .logo {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      font-size: clamp(3.2rem, 15vw, 6.5rem);
      line-height: 0.92;
      letter-spacing: 0.01em;
      -webkit-text-stroke: 8px #1a0a1f;
      text-stroke: 8px #1a0a1f;
      background: linear-gradient(180deg, #baf3ff 0%, #9fd8ff 30%, #c9a9ff 65%, #ffb3e0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(5px 6px 0 #1a0a1f);
      margin-bottom: 10px;
    }

    .tagline {
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: clamp(0.95rem, 3vw, 1.15rem);
      color: #ffffff;
      -webkit-text-stroke: 2px #1a0a1f;
      text-stroke: 2px #1a0a1f;
      line-height: 1.4;
      margin: 18px auto 28px auto;
      max-width: 400px;
    }

    /* ---------------- PILL BUTTONS ---------------- */
    .pill-main {
      display: inline-block;
      background: #7bdc6b;
      border: 4px solid #1a0a1f;
      border-radius: 999px;
      padding: 14px 44px;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 1.4rem;
      color: #1a0a1f;
      text-decoration: none;
      box-shadow: 4px 5px 0 #1a0a1f;
      transition: transform 0.12s ease;
      margin-bottom: 34px;
    }
    .pill-main:hover { transform: translate(-2px, -2px); }
    .pill-main:active { transform: translate(1px, 2px); box-shadow: 2px 2px 0 #1a0a1f; }

    .pill-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .pill-nav a {
      background: #ffffff;
      border: 3px solid #1a0a1f;
      border-radius: 999px;
      padding: 8px 20px;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 0.95rem;
      color: #1a0a1f;
      text-decoration: none;
      box-shadow: 3px 4px 0 #1a0a1f;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .pill-nav a:nth-child(1) { background: #ffe066; }
    .pill-nav a:nth-child(2) { background: #8fc9ff; }
    .pill-nav a:nth-child(3) { background: #ffb3e0; }
    .pill-nav a:nth-child(4) { background: #baf3d0; }
    .pill-nav a:hover { transform: translate(-2px, -2px); }
    .pill-nav a:active { transform: translate(1px, 2px); box-shadow: 1px 2px 0 #1a0a1f; }

    @media (max-width: 480px) {
      .logo { -webkit-text-stroke: 5px #1a0a1f; text-stroke: 5px #1a0a1f; filter: drop-shadow(3px 4px 0 #1a0a1f); }
      .tagline { -webkit-text-stroke: 1.5px #1a0a1f; text-stroke: 1.5px #1a0a1f; }
      .pill-main { padding: 12px 32px; font-size: 1.15rem; }
      .pill-nav a { padding: 7px 16px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  </div>

</html>
